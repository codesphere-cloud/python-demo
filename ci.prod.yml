schemaVersion: v0.2
prepare:
  steps:
    - name: install uv standalone version
      command: nix-env -iA nixpkgs.uv
    - name: create environment file
      command: |
        cat > ./env << 'EOF'
        export UV_PYTHON_INSTALL_DIR=$PWD/.codesphere-internal/.uv-python-install
        export UV_PYTHON_BIN_DIR=$PWD/.codesphere-internal/.uv-python-bin
        export UV_CACHE_DIR=$PWD/.codesphere-internal/.uv
        export UV_PYTHON_CACHE_DIR=$PWD/.codesphere-internal/.uv-python
        EOF
    - name: install frontend environment
      command: cd frontend && { [ ! -d ".venv" ] && uv venv; uv sync --no-dev; }
    - name: install backend environment
      command: cd backend && { [ ! -d ".venv" ] && uv venv; uv sync --no-dev; }
test:
  steps: []
run:
  frontend:
    steps:
      - name: start frontend application
        command: "cd frontend && uv run streamlit run main.py --server.headless true
          --server.address 0.0.0.0 --server.port 3000 --browser.gatherUsageStats
          false --logger.level info "
    plan: 8
    replicas: 1
    isPublic: true
    network:
      path: /
      stripPath: false
  backend:
    steps:
      - name: start backend application
        command: cd backend && uv run uvicorn app:app --port 3000 --host 0.0.0.0
          --workers 2
    plan: 8
    replicas: 1
    isPublic: false
  api-docs:
    steps:
      - name: deploy docs
        command: cd backend && uv run uvicorn doc:app_docs --host 0.0.0.0 --port 3000
          --workers 2
    plan: 8
    replicas: 1
    isPublic: true
    network:
      path: /api
      stripPath: false
